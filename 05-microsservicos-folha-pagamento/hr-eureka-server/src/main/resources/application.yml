spring:
  application:
    name: hr-eureka-server

server:
  port: 8761

eureka:
  client:
    # O servidor não se registra nele mesmo
    register-with-eureka: false
    fetch-registry: false
  server:
    # Remove instâncias mortas mais rápido (bom pra estudo, não pra produção)
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health
