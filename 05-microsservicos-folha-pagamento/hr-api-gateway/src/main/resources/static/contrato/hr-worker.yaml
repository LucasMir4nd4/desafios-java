openapi: 3.0.3
info:
  title: hr-worker — CONTRATO DA TAREFA
  version: 1.0.0
  description: |
    Contrato que o **hr-worker** precisa cumprir. As chamadas abaixo passam pelo gateway
    (`/hr-worker/...`), então "Try it out" funciona assim que você implementar.

    Toda resposta do hr-worker deve trazer o header `X-Instance` com a porta da instância (TASK-05).
servers:
  - url: /hr-worker
    description: Via API Gateway
tags:
  - name: Workers
paths:
  /workers:
    get:
      tags: [Workers]
      summary: "TASK-01 — Lista todos os funcionários"
      operationId: findAll
      responses:
        "200":
          description: Lista (pode ser vazia, nunca null)
          headers:
            X-Instance: { $ref: "#/components/headers/XInstance" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Worker" }
    post:
      tags: [Workers]
      summary: "TASK-03 — Cadastra um funcionário"
      operationId: insert
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkerInput" }
            examples:
              valido:
                value: { name: "Isabela Freitas", dailyIncome: 310.40 }
              invalido:
                value: { name: "  ", dailyIncome: -10 }
      responses:
        "201":
          description: Criado. O header Location aponta para /workers/{id}
          headers:
            Location:
              schema: { type: string, example: "/workers/9" }
            X-Instance: { $ref: "#/components/headers/XInstance" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Worker" }
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
  /workers/{id}:
    get:
      tags: [Workers]
      summary: "TASK-02 — Busca um funcionário pelo id"
      operationId: findById
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, example: 1 }
      responses:
        "200":
          description: Encontrado
          headers:
            X-Instance: { $ref: "#/components/headers/XInstance" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Worker" }
        "404":
          description: Não existe funcionário com esse id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandardError" }
              example:
                timestamp: "2026-11-23T21:30:00Z"
                status: 404
                error: "Not Found"
                message: "Funcionário 999 não encontrado"
                path: "/workers/999"
components:
  headers:
    XInstance:
      description: Porta da instância do hr-worker que respondeu
      schema: { type: string, example: "8001" }
  schemas:
    Worker:
      type: object
      required: [id, name, dailyIncome]
      properties:
        id: { type: integer, format: int64, example: 1 }
        name: { type: string, example: "Ana Souza" }
        dailyIncome:
          type: number
          description: Valor da diária. Dinheiro = BigDecimal, nunca double.
          example: 200.00
    WorkerInput:
      type: object
      required: [name, dailyIncome]
      properties:
        name:
          type: string
          description: Obrigatório, não pode ser só espaços, máx. 100 caracteres
          maxLength: 100
          example: "Isabela Freitas"
        dailyIncome:
          type: number
          description: Obrigatório e maior que zero
          exclusiveMinimum: true
          minimum: 0
          example: 310.40
    StandardError:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer, example: 404 }
        error: { type: string, example: "Not Found" }
        message: { type: string }
        path: { type: string, example: "/workers/999" }
    ValidationError:
      allOf:
        - $ref: "#/components/schemas/StandardError"
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                properties:
                  field: { type: string, example: "dailyIncome" }
                  message: { type: string, example: "deve ser maior que 0" }
