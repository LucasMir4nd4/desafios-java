spring:
  application:
    name: hr-api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            # /hr-worker/workers/1  ->  hr-worker  /workers/1  (balanceado entre as instâncias)
            - id: hr-worker
              uri: lb://hr-worker
              predicates:
                - Path=/hr-worker/**
              filters:
                - StripPrefix=1

            # /hr-payroll/payments/1/days/10  ->  hr-payroll  /payments/1/days/10
            - id: hr-payroll
              uri: lb://hr-payroll
              predicates:
                - Path=/hr-payroll/**
              filters:
                - StripPrefix=1

            # Usado pelo front para mostrar os serviços registrados no Eureka
            - id: eureka-registry
              uri: ${EUREKA_HOST:http://localhost:8761}
              predicates:
                - Path=/registry/apps
              filters:
                - SetPath=/eureka/apps

server:
  port: 8765

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    # Cada instância aparece com a própria porta no Eureka (ex.: hr-worker:8001)
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls-primary-name: "Contrato - hr-worker"
    urls:
      # Contrato da tarefa (o que você TEM que entregar). Funciona mesmo sem implementação.
      - name: "Contrato - hr-worker"
        url: /contrato/hr-worker.yaml
      - name: "Contrato - hr-payroll"
        url: /contrato/hr-payroll.yaml
      # Documentação gerada a partir do SEU código (aparece quando o serviço estiver no ar)
      - name: "Implementação - hr-worker"
        url: /hr-worker/v3/api-docs
      - name: "Implementação - hr-payroll"
        url: /hr-payroll/v3/api-docs
